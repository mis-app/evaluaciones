<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Evaluaciones - Múltiples Cursos</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 5px;
        }

        p {
            text-align: center;
            margin-bottom: 30px;
            color: #555;
        }

        .main-grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px;
            padding: 0 10px; 
        }

        .course-column {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .course-reference {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .course-ref-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            background-color: #e9ecef;
        }

        .evaluation-section {
            margin-bottom: 20px;
        }

        .ev-header {
            text-align: center;
            padding: 10px 0;
            margin-top: 0;
            margin-bottom: 5px;
            color: white;
            font-size: 1.5em;
            border-radius: 4px;
        }

        .ev-header-0 { background-color: #ff6666; }
        .ev-header-1 { background-color: #66b3ff; }
        .ev-header-2 { background-color: #99ff99; }

        .input-group {
            display: flex;
            margin: 15px 0;
        }

        .input-group input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 1em;
        }

        .input-group button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
            transition: background-color 0.3s;
        }

        .input-group button:hover {
            background-color: #1e7e34;
        }

        .student-list {
            list-style: none;
            padding: 0;
            min-height: 50px;
        }

        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 1.1em;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 10px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #c82333;
        }
    </style>
</head>
<body>
    <h1>📋 Seguimiento de Evaluaciones Pendientes por Curso</h1>
    <p>Añade los cursos y monitoriza a los alumnos que tengan evaluaciones pendientes.</p>

    <div id="main-grid-container" class="main-grid-container"></div>

    <script>
        const evaluations = ['ev0', 'ev1', 'ev2'];
        const totalCourses = 4;
        const courseKeys = Array.from({ length: totalCourses }, (_, i) => `course_${i + 1}`);

        document.addEventListener('DOMContentLoaded', () => {
            const mainContainer = document.getElementById('main-grid-container');

            courseKeys.forEach(courseKey => {
                mainContainer.appendChild(createCourseColumn(courseKey));
            });

            loadAllData();
            attachEventListeners();
        });

        function createCourseColumn(courseKey) {
            const column = document.createElement('div');
            column.className = 'course-column';
            column.id = `column-${courseKey}`;

            // Crear referencia del curso
            const courseRef = document.createElement('div');
            courseRef.className = 'course-reference';
            courseRef.innerHTML = `
                <input 
                    type="text" 
                    id="ref-input-${courseKey}" 
                    class="course-ref-input" 
                    placeholder="Curso ${courseKey.split('_')[1]}"
                >
            `;
            column.appendChild(courseRef);

            // Crear secciones de evaluación
            evaluations.forEach((ev, index) => {
                const section = document.createElement('div');
                section.className = 'evaluation-section';
                
                section.innerHTML = `
                    <h2 class="ev-header ev-header-${index}">EV${index}</h2>
                    <div class="input-group">
                        <input type="text" id="input-${courseKey}-${ev}" placeholder="Nombre del Alumno/a...">
                        <button class="add-student-btn" data-course="${courseKey}" data-eval="${ev}">Añadir</button>
                    </div>
                    <ul id="list-${courseKey}-${ev}" class="student-list"></ul>
                `;
                
                column.appendChild(section);
            });

            return column;
        }
        
        function attachEventListeners() {
            // Eventos para botones de añadir
            document.querySelectorAll('.add-student-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const courseKey = this.getAttribute('data-course');
                    const evaluation = this.getAttribute('data-eval');
                    addStudent(courseKey, evaluation);
                });
            });

            // Eventos para inputs de referencia del curso
            document.querySelectorAll('.course-ref-input').forEach(input => {
                input.addEventListener('change', function() {
                    const courseKey = this.id.replace('ref-input-', '');
                    saveCourseReference(courseKey, this.value);
                });
            });
        }

        function addStudent(courseKey, evaluation) {
            const inputElement = document.getElementById(`input-${courseKey}-${evaluation}`);
            const studentName = inputElement.value.trim();

            if (studentName === "") {
                alert("Por favor, introduce el nombre del alumno/a.");
                return;
            }

            const uniqueId = `${courseKey}_${evaluation}`;
            
            if (saveStudent(uniqueId, studentName)) {
                createStudentItem(uniqueId, studentName);
            } else {
                alert("Este alumno ya está en la lista.");
            }
           
            inputElement.value = "";
        }

        function createStudentItem(uniqueId, name) {
            const list = document.getElementById(`list-${uniqueId}`);
            
            if (!list) {
                console.error(`Error: No se encontró la lista con ID: list-${uniqueId}`);
                return;
            }

            const listItem = document.createElement('li');
            listItem.className = 'student-item';
            listItem.setAttribute('data-student-name', name);
            
            const nameSpan = document.createElement('span');
            nameSpan.textContent = name;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✖';
            deleteBtn.addEventListener('click', function() {
                removeStudent(uniqueId, name, listItem);
            });

            listItem.appendChild(nameSpan);
            listItem.appendChild(deleteBtn);
            list.appendChild(listItem);
        }

        function removeStudent(uniqueId, studentName, listItem) {
            listItem.remove();
            deleteStudent(uniqueId, studentName);
        }

        function saveCourseReference(courseKey, refValue) {
            localStorage.setItem(`ref_${courseKey}`, refValue);
        }

        function saveStudent(uniqueId, name) {
            const students = JSON.parse(localStorage.getItem(uniqueId)) || [];
            
            if (!students.includes(name)) {
                students.push(name);
                localStorage.setItem(uniqueId, JSON.stringify(students));
                return true;
            }
            return false;
        }

        function deleteStudent(uniqueId, name) {
            let students = JSON.parse(localStorage.getItem(uniqueId)) || [];
            students = students.filter(student => student !== name);
            localStorage.setItem(uniqueId, JSON.stringify(students));
        }

        function loadAllData() {
            courseKeys.forEach(courseKey => {
                const savedRef = localStorage.getItem(`ref_${courseKey}`);
                if (savedRef) {
                    const refInput = document.getElementById(`ref-input-${courseKey}`);
                    if (refInput) {
                        refInput.value = savedRef;
                    }
                }

                evaluations.forEach(ev => {
                    const uniqueId = `${courseKey}_${ev}`;
                    const students = JSON.parse(localStorage.getItem(uniqueId)) || [];
                    
                    students.forEach(name => {
                        createStudentItem(uniqueId, name);
                    });
                });
            });
        }
    </script>
</body>
</html>
